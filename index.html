<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malak Shop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap');

:root {
  --bg:        #0a0a0a;
  --surface:   #111111;
  --surface2:  #1a1a1a;
  --surface3:  #222222;
  --border:    #2a2a2a;
  --border2:   #333333;
  --text:      #f0f0f0;
  --text-muted:#888888;
  --text-dim:  #555555;
  --accent:    #ffffff;
  --green:     #1a3a1a;
  --green-text:#4caf50;
  --radius:    10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand-name {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: 1px;
}

.brand-sub {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 400;
}

.btn-data {
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 8px 22px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  font-weight: 700;
  transition: background 0.2s, border-color 0.2s;
  letter-spacing: 0.5px;
}

.btn-data:hover {
  background: var(--border2);
  border-color: #555;
}

/* ── CHAT LAYOUT ── */
#chat-page {
  display: flex;
  flex-direction: column;
  flex: 1;
}

#chat-page.hidden { display: none; }

.chat-body {
  flex: 1;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
  padding: 20px 16px 0;
  display: flex;
  flex-direction: column;
}

.messages-area {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-bottom: 10px;
  scroll-behavior: smooth;
}

.messages-area::-webkit-scrollbar { width: 3px; }
.messages-area::-webkit-scrollbar-thumb { background: var(--border2); }

/* ── MESSAGES ── */
.msg-row {
  display: flex;
  gap: 10px;
  animation: slideIn 0.28s ease;
}

.msg-row.bot { align-items: flex-end; }
.msg-row.user { flex-direction: row-reverse; align-items: flex-end; }

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0;
}

.avatar.bot {
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text-muted);
}

.avatar.user {
  background: var(--border2);
  border: 1px solid #444;
  color: var(--text-muted);
}

.bubble {
  max-width: 76%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.7;
  word-break: break-word;
}

.bubble.bot {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-bottom-right-radius: 3px;
}

.bubble.user {
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  border-bottom-left-radius: 3px;
}

/* ── TYPING ── */
.typing-row { display: flex; gap: 10px; align-items: flex-end; }

.typing-bubble {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 14px 18px;
  border-radius: var(--radius);
  border-bottom-right-radius: 3px;
  display: flex;
  gap: 5px;
  align-items: center;
}

.dot {
  width: 6px; height: 6px;
  background: var(--text-dim);
  border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.dot:nth-child(2) { animation-delay: 0.16s; }
.dot:nth-child(3) { animation-delay: 0.32s; }

@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* ── PRODUCTS GRID ── */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
  margin-top: 10px;
}

.product-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  text-align: center;
  transition: border-color 0.2s;
}

.product-card:hover { border-color: #555; }

.product-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}

.product-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.product-price {
  display: inline-block;
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 50px;
}

/* ── DELIVERY TABLE ── */
.delivery-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 13px;
}

.delivery-table th {
  background: var(--surface3);
  color: var(--text-muted);
  padding: 8px 12px;
  text-align: right;
  font-weight: 700;
  border-bottom: 1px solid var(--border);
}

.delivery-table td {
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

.delivery-table tr:last-child td { border-bottom: none; }

/* ── QUICK BUTTONS ── */
.quick-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 8px;
}

.qbtn {
  padding: 8px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.18s, border-color 0.18s;
  white-space: nowrap;
}

.qbtn:hover {
  background: var(--surface3);
  border-color: #555;
}

/* ── ORDER SUMMARY ── */
.order-summary {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-top: 8px;
}

.summary-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--border);
}

.summary-row:last-child { border-bottom: none; }
.summary-label { color: var(--text-muted); }
.summary-value { font-weight: 700; color: var(--text); }

/* ── INPUT AREA ── */
.input-area {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  position: sticky;
  bottom: 0;
  max-width: 720px;
  width: 100%;
  margin: 0 auto;
}

/* full-width input bar */
.input-area-wrap {
  background: var(--surface);
  border-top: 1px solid var(--border);
  position: sticky;
  bottom: 0;
}

.input-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.chat-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  min-height: 42px;
  max-height: 120px;
  overflow-y: auto;
}

.chat-input:focus { border-color: #555; }

.chat-input:empty::before {
  content: attr(data-placeholder);
  color: var(--text-dim);
  pointer-events: none;
}

.send-btn {
  width: 42px; height: 42px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
  flex-shrink: 0;
}

.send-btn:hover { background: #333; border-color: #555; }

/* ── CODE POPUP ── */
.overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.82);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
}

.overlay.hidden { display: none; }

.popup {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 32px 28px;
  width: 90%;
  max-width: 340px;
  animation: popIn 0.25s ease;
}

@keyframes popIn {
  from { opacity: 0; transform: scale(0.92); }
  to   { opacity: 1; transform: scale(1); }
}

.popup-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}

.popup-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.popup-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 11px 16px;
  font-family: 'Tajawal', sans-serif;
  font-size: 18px;
  text-align: center;
  letter-spacing: 4px;
  font-weight: 700;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  margin-bottom: 8px;
}

.popup-input:focus { border-color: #555; }
.popup-input.error { border-color: #c0392b; animation: shake 0.3s ease; }

@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-7px); }
  75% { transform: translateX(7px); }
}

.popup-error {
  font-size: 13px;
  color: #c0392b;
  font-weight: 600;
  margin-bottom: 14px;
  min-height: 18px;
  text-align: center;
}

.popup-actions { display: flex; gap: 8px; }

.btn-confirm {
  flex: 1;
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 11px;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: background 0.18s;
}

.btn-confirm:hover { background: #333; border-color: #555; }

.btn-cancel {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--text-muted);
  cursor: pointer;
  transition: border-color 0.18s;
}

.btn-cancel:hover { border-color: #555; color: var(--text); }

/* ── ORDERS PAGE ── */
#orders-page {
  display: none;
  flex-direction: column;
  min-height: 100vh;
}

#orders-page.active { display: flex; }

.orders-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.orders-title {
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: 0.5px;
}

.orders-meta {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 400;
  margin-top: 2px;
}

.btn-back {
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 8px 20px;
  border-radius: var(--radius);
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  font-weight: 700;
  transition: background 0.2s;
}

.btn-back:hover { background: #333; border-color: #555; }

.orders-body {
  padding: 24px;
  overflow-x: auto;
  flex: 1;
}

.table-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  overflow-x: auto;
}

.orders-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 820px;
}

.orders-table th {
  background: var(--surface2);
  color: var(--text-muted);
  padding: 13px 14px;
  text-align: right;
  font-size: 13px;
  font-weight: 700;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.orders-table td {
  padding: 13px 14px;
  font-size: 13px;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.orders-table tr:last-child td { border-bottom: none; }

.orders-table tr.confirmed td { background: var(--green); color: var(--green-text); }
.orders-table tr.confirmed .btn-confirm-order { border-color: var(--green-text); color: var(--green-text); }

.btn-confirm-order {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.18s;
  white-space: nowrap;
}

.btn-confirm-order:hover { border-color: var(--green-text); color: var(--green-text); }

.btn-delete-order {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text-muted);
  padding: 6px 12px;
  border-radius: 7px;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-size: 12px;
  font-weight: 700;
  transition: all 0.18s;
  white-space: nowrap;
}

.btn-delete-order:hover { border-color: #c0392b; color: #c0392b; }

.empty-state {
  text-align: center;
  padding: 70px 20px;
  color: var(--text-dim);
}

.empty-state-text { font-size: 16px; font-weight: 600; }

/* ── SECTION LABEL ── */
.section-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 8px;
}

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 74px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 10px 24px;
  border-radius: 50px;
  font-size: 14px;
  font-weight: 700;
  z-index: 2000;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .bubble { max-width: 88%; }
  .products-grid { grid-template-columns: 1fr 1fr; }
  .orders-body { padding: 12px; }
}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast">تم حفظ الطلب</div>

<!-- CODE POPUP -->
<div class="overlay hidden" id="code-overlay">
  <div class="popup">
    <div class="popup-title">كود الدخول</div>
    <div class="popup-sub">أدخل الكود السري للوصول إلى البيانات</div>
    <input type="password" class="popup-input" id="code-input"
      placeholder="_ _ _ _ _" maxlength="10"
      oninput="clearError()" onkeydown="if(event.key==='Enter') checkCode()">
    <div class="popup-error" id="code-error"></div>
    <div class="popup-actions">
      <button class="btn-confirm" onclick="checkCode()">دخول</button>
      <button class="btn-cancel" onclick="closePopup()">الغاء</button>
    </div>
  </div>
</div>

<!-- CHAT PAGE -->
<div id="chat-page">
  <header class="header">
    <div>
      <div class="brand-name">Malak Shop</div>
      <div class="brand-sub">متجر الأزياء النسائية</div>
    </div>
    <button class="btn-data" onclick="openCodePopup()">البيانات</button>
  </header>

  <div class="chat-body">
    <div class="messages-area" id="messages-area"></div>
  </div>

  <div class="input-area-wrap">
    <div class="input-inner">
      <div class="chat-input" id="chat-input" contenteditable="true"
        data-placeholder="اكتب رسالتك..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}">
      </div>
      <button class="send-btn" onclick="sendMessage()">&#10148;</button>
    </div>
  </div>
</div>

<!-- ORDERS PAGE -->
<div id="orders-page">
  <div class="orders-header">
    <div>
      <div class="orders-title">جدول الطلبات</div>
      <div class="orders-meta" id="orders-meta">0 طلب</div>
    </div>
    <button class="btn-back" onclick="goBack()">الرجوع</button>
  </div>
  <div class="orders-body">
    <div class="table-wrap">
      <table class="orders-table" id="orders-table">
        <thead>
          <tr>
            <th>#</th>
            <th>الاسم</th>
            <th>رقم الهاتف</th>
            <th>المنتج</th>
            <th>الكمية</th>
            <th>مكان التوصيل</th>
            <th>التاريخ</th>
            <th>هل تم التاكيد</th>
            <th>هل تم الارسال</th>
          </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
      <div class="empty-state hidden" id="empty-state">
        <div class="empty-state-text">لا توجد طلبات</div>
      </div>
    </div>
  </div>
</div>

<script>
// ============================================================
// DATA
// ============================================================
const SECRET_CODE = '2008M';

const PRODUCTS = [
  { name: 'فستان سهرة انيق',    desc: 'فستان فاخر للمناسبات',       price: '4500 دج' },
  { name: 'حذاء كعب عالٍ',      desc: 'جلد طبيعي بالوان متعددة',    price: '2800 دج' },
  { name: 'حقيبة يد فاخرة',     desc: 'جلد طبيعي بتصميم انيق',      price: '6000 دج' },
  { name: 'مجوهرات ذهبية',       desc: 'اكسسوار راقٍ لإطلالة مميزة', price: '8500 دج' },
  { name: 'وشاح حرير',           desc: 'حرير طبيعي ناعم',             price: '1800 دج' },
  { name: 'نظارة شمسية',         desc: 'عصرية بحماية UV 400',         price: '2200 دج' },
];

const WILAYAS = [
  { name: 'الجزائر العاصمة', price: '300 دج',  days: '1-2 يوم'   },
  { name: 'وهران',            price: '450 دج',  days: '2-3 ايام'  },
  { name: 'قسنطينة',          price: '450 دج',  days: '2-3 ايام'  },
  { name: 'عنابة',            price: '500 دج',  days: '2-3 ايام'  },
  { name: 'سطيف',             price: '500 دج',  days: '2-4 ايام'  },
  { name: 'تيزي وزو',         price: '400 دج',  days: '1-2 يوم'   },
  { name: 'بجاية',            price: '450 دج',  days: '2-3 ايام'  },
  { name: 'باقي الولايات',    price: '600 دج',  days: '3-5 ايام'  },
];

// ============================================================
// STATE
// ============================================================
let step  = 'welcome';
let order = {};

// ============================================================
// LOCAL STORAGE
// ============================================================
function getOrders()        { try { return JSON.parse(localStorage.getItem('malak_orders') || '[]'); } catch { return []; } }
function saveOrders(orders) { localStorage.setItem('malak_orders', JSON.stringify(orders)); }

// ============================================================
// CHAT UTILITIES
// ============================================================
const area = document.getElementById('messages-area');

function scrollBot() { area.scrollTop = area.scrollHeight; }

function addMsg(html, type = 'bot') {
  const row = document.createElement('div');
  row.className = `msg-row ${type}`;

  const av = document.createElement('div');
  av.className = `avatar ${type}`;
  av.textContent = type === 'bot' ? 'M' : 'A';

  const bub = document.createElement('div');
  bub.className = `bubble ${type}`;
  bub.innerHTML = html;

  if (type === 'bot') { row.appendChild(av); row.appendChild(bub); }
  else                { row.appendChild(av); row.appendChild(bub); }

  area.appendChild(row);
  scrollBot();
  return bub;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing-indicator';
  row.innerHTML = `<div class="avatar bot">M</div><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  area.appendChild(row);
  scrollBot();
}

function hideTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function botReply(html, delay = 750) {
  showTyping();
  return new Promise(resolve => setTimeout(() => {
    hideTyping();
    addMsg(html, 'bot');
    resolve();
  }, delay));
}

// ============================================================
// WELCOME
// ============================================================
async function startChat() {
  await new Promise(r => setTimeout(r, 400));

  const prodsHtml = `
    <div class="section-label" style="margin-top:4px;">منتجاتنا</div>
    <div class="products-grid">
      ${PRODUCTS.map(p => `
        <div class="product-card">
          <div class="product-name">${p.name}</div>
          <div class="product-desc">${p.desc}</div>
          <div class="product-price">${p.price}</div>
        </div>
      `).join('')}
    </div>
  `;

  const delivHtml = `
    <div class="section-label" style="margin-top:16px;">معلومات التوصيل</div>
    <table class="delivery-table">
      <thead><tr><th>الولاية</th><th>سعر التوصيل</th><th>المدة</th></tr></thead>
      <tbody>
        ${WILAYAS.map(w => `<tr><td>${w.name}</td><td>${w.price}</td><td>${w.days}</td></tr>`).join('')}
      </tbody>
    </table>
  `;

  await botReply(`
    <div style="font-size:20px;font-weight:900;margin-bottom:4px;">Malak Shop</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">متجر الازياء والاكسسوار النسائي</div>
    ${prodsHtml}
    ${delivHtml}
  `, 1000);

  await botReply(`
    <div style="font-weight:700;margin-bottom:10px;">هل تريد طلب منتج؟</div>
    <div class="quick-btns">
      <button class="qbtn" onclick="userChoice('نعم')">نعم</button>
      <button class="qbtn" onclick="userChoice('لا')">لا</button>
    </div>
  `, 500);

  step = 'ask_order';
}

// ============================================================
// FLOW
// ============================================================
async function userChoice(val) {
  addMsg(val, 'user');
  await handleStep(val);
}

async function sendMessage() {
  const inp = document.getElementById('chat-input');
  const txt = inp.innerText.trim();
  if (!txt) return;
  inp.innerText = '';
  addMsg(txt, 'user');
  await handleStep(txt);
}

async function handleStep(txt) {
  const t = txt.trim();

  // ask_order
  if (step === 'ask_order') {
    if (t === 'نعم' || t.includes('نعم') || t.toLowerCase() === 'yes') {
      step = 'get_name';
      await botReply('سنبدأ بتسجيل طلبك.<br><br><b>ما هو اسمك الكامل؟</b>');
    } else {
      step = 'done';
      await botReply('حسناً، نحن هنا دائماً اذا احتجت شيئاً.<div class="quick-btns" style="margin-top:10px;"><button class="qbtn" onclick="restartChat()">ابدأ من جديد</button></div>');
    }
    return;
  }

  // get_name
  if (step === 'get_name') {
    if (t.length < 3) { await botReply('يرجى ادخال اسمك الكامل.'); return; }
    order.name = t;
    step = 'get_phone';
    await botReply(`شكراً ${t}.<br><br><b>ما هو رقم هاتفك؟</b>`);
    return;
  }

  // get_phone
  if (step === 'get_phone') {
    if (!/^[0-9+]{9,15}$/.test(t.replace(/\s/g, ''))) { await botReply('يرجى ادخال رقم هاتف صحيح.'); return; }
    order.phone = t;
    step = 'get_product';
    const btns = PRODUCTS.map(p => `<button class="qbtn" onclick="userChoice('${p.name}')">${p.name} — ${p.price}</button>`).join('');
    await botReply(`<b>اختر المنتج:</b><div class="quick-btns" style="flex-direction:column;align-items:flex-start;gap:5px;margin-top:8px;">${btns}</div>`);
    return;
  }

  // get_product
  if (step === 'get_product') {
    const found = PRODUCTS.find(p => p.name === t || t.includes(p.name));
    if (!found) { await botReply('يرجى اختيار منتج من القائمة.'); return; }
    order.product = found.name;
    order.price   = found.price;
    step = 'get_qty';
    const btns = [1,2,3,4,5].map(n => `<button class="qbtn" onclick="userChoice('${n}')">${n}</button>`).join('');
    await botReply(`تم اختيار <b>${found.name}</b>.<br><br><b>كم الكمية؟</b><div class="quick-btns" style="margin-top:8px;">${btns}</div>`);
    return;
  }

  // get_qty
  if (step === 'get_qty') {
    const n = parseInt(t);
    if (!n || n < 1 || n > 100) { await botReply('يرجى ادخال كمية صحيحة.'); return; }
    order.qty = n;
    step = 'get_wilaya';
    const btns = WILAYAS.map(w => `<button class="qbtn" onclick="userChoice('${w.name}')">${w.name} (${w.price})</button>`).join('');
    await botReply(`<b>اختر الولاية / مكان التوصيل:</b><div class="quick-btns" style="flex-wrap:wrap;margin-top:8px;">${btns}</div>`);
    return;
  }

  // get_wilaya
  if (step === 'get_wilaya') {
    const found = WILAYAS.find(w => w.name === t);
    if (!found) { await botReply('يرجى اختيار ولاية من القائمة.'); return; }
    order.wilaya       = found.name;
    order.delivPrice   = found.price;
    order.delivDays    = found.days;
    step = 'confirm';

    await botReply(`
      <div class="order-summary">
        <div class="summary-title">ملخص الطلب</div>
        <div class="summary-row"><span class="summary-label">الاسم</span><span class="summary-value">${order.name}</span></div>
        <div class="summary-row"><span class="summary-label">الهاتف</span><span class="summary-value">${order.phone}</span></div>
        <div class="summary-row"><span class="summary-label">المنتج</span><span class="summary-value">${order.product}</span></div>
        <div class="summary-row"><span class="summary-label">الكمية</span><span class="summary-value">${order.qty}</span></div>
        <div class="summary-row"><span class="summary-label">الولاية</span><span class="summary-value">${order.wilaya}</span></div>
        <div class="summary-row"><span class="summary-label">التوصيل</span><span class="summary-value">${order.delivPrice} — ${order.delivDays}</span></div>
      </div>
      <div style="margin-top:12px;font-weight:700;">هل انت متاكد من هذه المعلومات؟</div>
      <div class="quick-btns" style="margin-top:8px;">
        <button class="qbtn" onclick="confirmOrder()">نعم، تاكيد الطلب</button>
        <button class="qbtn" onclick="editOrder()">تعديل</button>
      </div>
    `);
    return;
  }

  if (step === 'done') { restartChat(); }
}

// ============================================================
// CONFIRM / EDIT ORDER
// ============================================================
async function confirmOrder() {
  const now     = new Date();
  const dateStr = now.toLocaleDateString('ar-DZ', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });

  const orders = getOrders();
  orders.push({
    id:        Date.now(),
    name:      order.name,
    phone:     order.phone,
    product:   order.product,
    qty:       order.qty,
    wilaya:    order.wilaya,
    date:      dateStr,
    confirmed: false,
  });
  saveOrders(orders);

  order = {};
  step  = 'done';
  showToast();

  await botReply(`
    <div style="font-size:16px;font-weight:800;margin-bottom:6px;">تم تاكيد طلبك</div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">سيتم التواصل معك قريباً لتاكيد التوصيل</div>
    <div class="quick-btns"><button class="qbtn" onclick="restartChat()">طلب اخر</button></div>
  `);
}

async function editOrder() {
  order = {};
  step  = 'get_name';
  await botReply('سنبدأ من جديد.<br><br><b>ما هو اسمك الكامل؟</b>');
}

async function restartChat() {
  area.innerHTML = '';
  order = {};
  step  = 'welcome';
  await startChat();
}

// ============================================================
// CODE POPUP
// ============================================================
function openCodePopup() {
  document.getElementById('code-overlay').classList.remove('hidden');
  document.getElementById('code-input').value = '';
  document.getElementById('code-error').textContent = '';
  setTimeout(() => document.getElementById('code-input').focus(), 80);
}

function closePopup() {
  document.getElementById('code-overlay').classList.add('hidden');
}

function clearError() {
  document.getElementById('code-error').textContent = '';
  document.getElementById('code-input').classList.remove('error');
}

function checkCode() {
  const val = document.getElementById('code-input').value.trim();
  if (val === SECRET_CODE) {
    closePopup();
    openOrders();
  } else {
    const inp = document.getElementById('code-input');
    document.getElementById('code-error').textContent = 'حاول مجدداً';
    inp.classList.add('error');
    inp.value = '';
    setTimeout(() => { inp.classList.remove('error'); inp.focus(); }, 400);
  }
}

// ============================================================
// ORDERS PAGE
// ============================================================
function openOrders() {
  document.getElementById('chat-page').classList.add('hidden');
  document.getElementById('orders-page').classList.add('active');
  renderOrders();
}

function goBack() {
  document.getElementById('orders-page').classList.remove('active');
  document.getElementById('chat-page').classList.remove('hidden');
}

function renderOrders() {
  const orders = getOrders();
  const tbody  = document.getElementById('orders-tbody');
  const empty  = document.getElementById('empty-state');

  document.getElementById('orders-meta').textContent = `${orders.length} طلب`;

  if (orders.length === 0) {
    tbody.innerHTML = '';
    empty.classList.remove('hidden');
    return;
  }

  empty.classList.add('hidden');

  tbody.innerHTML = orders.map((o, i) => `
    <tr id="row-${o.id}" class="${o.confirmed ? 'confirmed' : ''}">
      <td>${i + 1}</td>
      <td>${o.name}</td>
      <td dir="ltr">${o.phone}</td>
      <td>${o.product}</td>
      <td>${o.qty}</td>
      <td>${o.wilaya}</td>
      <td style="font-size:12px;color:var(--text-muted);white-space:nowrap;">${o.date}</td>
      <td>
        <button class="btn-confirm-order" onclick="confirmRow(${o.id})">
          ${o.confirmed ? 'مؤكد' : 'تاكيد'}
        </button>
      </td>
      <td>
        <button class="btn-delete-order" onclick="deleteRow(${o.id})">تم الارسال</button>
      </td>
    </tr>
  `).join('');
}

function confirmRow(id) {
  const orders = getOrders();
  const idx    = orders.findIndex(o => o.id === id);
  if (idx > -1) {
    orders[idx].confirmed = true;
    saveOrders(orders);
    renderOrders();
  }
}

function deleteRow(id) {
  const orders = getOrders().filter(o => o.id !== id);
  saveOrders(orders);
  renderOrders();
}

// ============================================================
// TOAST
// ============================================================
function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('load', startChat);
</script>
